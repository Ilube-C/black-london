name: openplaques-check
# Weekly: refreshes the Nubian Jak snapshot from Open Plaques, adds any new
# London plaques as draft sites, validates, and pushes straight to main.
# Ingest never overwrites an existing site. Vercel redeploys on push.
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DATA_BOT_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/adapters/openplaques.mjs check --report report.md
      - run: '[ -f report.md ] && cat report.md >> "$GITHUB_STEP_SUMMARY" || true'
      - run: node scripts/adapters/openplaques.mjs fetch
      - run: node scripts/adapters/openplaques.mjs ingest
      - run: npm run validate
      - run: npm run build:index
      - name: Push to main
        run: |
          if git diff --quiet -I '"generated_at"' -- data-source public/data; then
            echo "No plaque changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-source/openplaques public/data
          git commit -m "Nubian Jak plaques: sync from Open Plaques"
          git push origin HEAD:main
