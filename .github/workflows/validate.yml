name: validate-data
on:
  pull_request:
    paths:
      - 'public/data/**'
      - 'data-source/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build:index
      - name: Confirm manifest is up to date
        run: |
          if ! git diff --exit-code public/data/manifest-data.json; then
            echo "::error::manifest-data.json is out of date — run \`npm run build:index\` and commit the result."
            exit 1
          fi
