name: bca-events
# Daily: pulls Black Cultural Archives events (venue from Eventbrite) and opens
# or updates a PR on the `data/bca-events` branch when the events changed.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bca-events
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/adapters/bca-events.mjs --report report.md
        env:
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
      - run: cat report.md >> "$GITHUB_STEP_SUMMARY"
      # PRs opened with the Actions token don't trigger other workflows, so validate here.
      - run: npm run validate
      - run: npm run build:index
      - name: Open or update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data/events.geojson; then
            echo "No event changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B data/bca-events
          git add public/data/events.geojson public/data/manifest-data.json
          git commit -m "BCA events: sync from Eventbrite"
          git push --force origin data/bca-events
          if [ -z "$(gh pr list --head data/bca-events --state open --json number --jq '.[0].number')" ]; then
            gh pr create --head data/bca-events --base main --title "BCA events update" --body-file report.md --assignee Ilube-C
          else
            gh pr edit data/bca-events --body-file report.md
          fi
