name: bca-events
# Daily: pulls Black Cultural Archives events (venue from Eventbrite), validates
# them, and pushes straight to main when they changed. Vercel then redeploys.
# Pushes with the DATA_BOT_KEY deploy key, which may bypass the main ruleset.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DATA_BOT_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/adapters/bca-events.mjs --report report.md
        env:
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
      - run: cat report.md >> "$GITHUB_STEP_SUMMARY"
      - run: npm run validate
      - run: npm run build:index
      - name: Push to main
        run: |
          if git diff --quiet -- public/data/events.geojson; then
            echo "No event changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/events.geojson public/data/manifest-data.json
          git commit -m "BCA events: sync from Eventbrite"
          git push origin HEAD:main
