name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      # Cloudflare Pages: configure via the dashboard to deploy ./dist on push,
      # or use cloudflare/pages-action with CLOUDFLARE_ACCOUNT_ID + CLOUDFLARE_API_TOKEN secrets.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
